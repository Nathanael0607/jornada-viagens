<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Jornada Viagens</title>
  </head>
  <body>
    <header>
      <a
        class="logo"
        class="menu"
        href="index.html"
        title="Voltar a página inicial"
      >
        <img
          class="logo-mobile"
          src="img/bussola-jornada-branca.png"
          alt="Bussola do Logo Jornada Viagens na cor branca"
        />
        <img
          class="logo-desktop"
          src="img/bussola-texto-jornada-branco.png"
          alt="Logo Jornada Viagens na cor branca"
        />
      </a>

      <!-- <div> Ela serve puramente para agrupar outros elementos (como textos, imagens, botões ou outras tags) para que você possa organizá-los e estilizá-los juntos -->
      <div class="navigation-menu">
        <label for="menu">
          <img src="img/menu.png" alt="Menu" />
        </label>

        <!-- O atributo hidden serve para ocultar o input-->
        <input type="checkbox" id="menu" hidden />

        <!-- <nav> Ela é usada para agrupar o menu principal do site, rodapés com links importantes, índices ou barras laterais de navegação.-->
        <nav>
          <ul class="list-links">
            <li>
              <!-- O atributo target="_blank" serve para abrir o link em outra aba-->
              <a href="blog.html" target="_blank" title="Acessar blog">Blog</a>
            </li>
            <li>
              <a
                href="pacotes.html"
                target="_blank"
                title="Acessar pacotes de viagem"
                >Pacotes de viagem</a
              >
            </li>
            <li>
              <a href="promocoes.html" target="_blank" title="Acessar promoções"
                >Promoções</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="hero">
      <div class="hero-img"></div>
      <h2>
        Somos uma agência apaixonada por criar viagens inesquecíveis. Do destino
        à seleção das atividades, cuidamos de todos os detalhes para que você
        aproveite ao máximo cada momento da sua jornada!
      </h2>
    </section>
    <section class="offers">
      <div class="section-tittle">
        <h2>Ofertas da semana</h2>
      <hr /> <!-- O atributo hr serve para criar uma linha horizontal-->
      </div>
    </section>
    <section class="categories">
      <div class="section-tittle">
        <h2>Busque por Categoria</h2>
      <hr />
      </div>
    </section>
  </body>
</html>
